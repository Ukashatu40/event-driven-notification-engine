# Docker Compose file for Notification Engine
version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: notification_engine
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: change-me
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    command: redis-server --requirepass change-me
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  kafka:
    image: bitnami/kafka:latest
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notification-engine
    ports:
      - '9092:9092'

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: notification_user
      RABBITMQ_DEFAULT_PASS: change-me
    ports:
      - '5672:5672'
      - '15672:15672'

volumes:
  postgres_data:
  redis_data:
