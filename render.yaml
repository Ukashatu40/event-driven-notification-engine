# render.yaml — Blueprint for the backend on Render's free plan.
#
# Deploy: Render dashboard → New + → Blueprint → connect this repo. Render
# reads this file, creates ONE web service (Docker, free plan), and prompts
# you once for every `sync: false` variable below — that prompt IS the whole
# "add these to Environment" step from DEPLOYMENT-CLOUD.md, just declared
# here instead of clicked through by hand. `generateValue: true` variables
# need no input at all; Render fills them with its own random secret.
#
# This declares the APP only, on purpose — Postgres/Redis/Kafka/RabbitMQ stay
# on the external free providers in DEPLOYMENT-CLOUD.md (Neon/Upstash/Aiven/
# CloudAMQP), not Render's own managed databases, which is where the actual
# free tier lives for this stack.
services:
  - name: notification-engine
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Fixed, non-secret — same for every deploy of this app.
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: WealthBridge
      - key: JWT_EXPIRY
        value: 1h
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: KAFKA_CLIENT_ID
        value: notification-engine
      - key: KAFKA_GROUP_ID_STANDARD
        value: notification-standard-cg
      - key: KAFKA_GROUP_ID_CRITICAL
        value: notification-critical-cg
      - key: KAFKA_SSL
        value: 'true'
      - key: RABBITMQ_EXCHANGE
        value: notifications
      - key: RABBITMQ_DLX
        value: notifications.dlx
      - key: REDIS_TLS
        value: 'true'
      - key: REDIS_DB
        value: '0'
      - key: CONSENT_ENFORCEMENT
        value: enforce
      - key: ENABLE_AB_TESTING
        value: 'true'
      - key: ENABLE_SEND_TIME_OPTIMIZATION
        value: 'true'
      - key: ENABLE_WEBSOCKET_DASHBOARD
        value: 'true'
      # Render has no equivalent to Compose's one-shot `migrate` service —
      # docker/entrypoint.sh runs `prisma migrate deploy` before boot when
      # this is true. Fine to leave true permanently: an already-applied
      # migration is a no-op.
      - key: RUN_MIGRATIONS_ON_BOOT
        value: 'true'
      - key: MSG91_SENDER_ID
        value: WLTHBR
      - key: SMTP_PORT
        value: '587'
      - key: TERMII_BASE_URL
        value: https://api.ng.termii.com
      # Required by env.validation.ts's Joi schema but functionally dead:
      # database.config.ts builds a `database` config object from these, and
      # nothing ever reads it — Prisma connects via DATABASE_URL only (see
      # prisma.config.js). Real, fixed placeholders so the Blueprint prompt
      # doesn't ask you for values that don't do anything.
      - key: DB_HOST
        value: unused-prisma-uses-database-url
      - key: DB_PORT
        value: '5432'
      - key: DB_NAME
        value: unused
      - key: DB_USER
        value: unused
      - key: DB_PASSWORD
        value: unused

      # Auto-generated by Render — internal secrets nothing else ever needs
      # to know or reuse, so there's nothing to paste.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEBHOOK_SIGNATURE_SECRET
        generateValue: true

      # Prompted once at Blueprint creation (or set later in the dashboard) —
      # infra endpoints from Neon/Upstash/Aiven/CloudAMQP/Brevo, per
      # DEPLOYMENT-CLOUD.md, plus the two PII keys (must stay real hex —
      # generateValue's base64 output would fail PII_ENCRYPTION_KEY's format
      # check — and the three role login keys, worth choosing yourself so
      # you actually know them for the ops console).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: KAFKA_BROKERS
        sync: false
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      # Aiven's Kafka broker cert is signed by Aiven's own CA, not a public
      # one — ssl:true alone fails with "self-signed certificate in
      # certificate chain". Aiven console → Service → Overview → "CA
      # Certificate" → download as ca.pem, then paste its BASE64 here (one
      # line, nothing for a form field to mangle): on macOS,
      # `base64 -i ca.pem | tr -d '\n'`; on Linux, `base64 -w0 ca.pem`.
      - key: KAFKA_SSL_CA
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: PII_HASH_KEY
        sync: false
      - key: SERVICE_API_KEY
        sync: false
      - key: OPERATOR_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false

      # Optional integrations this deployment doesn't use — left blank so
      # the Blueprint prompt doesn't ask about them; fill in later via the
      # dashboard only if you actually wire one up.
      - key: MSG91_API_KEY
        value: ''
      - key: MSG91_TEMPLATE_ID
        value: ''
      - key: TWILIO_ACCOUNT_SID
        value: ''
      - key: TWILIO_AUTH_TOKEN
        value: ''
      - key: TWILIO_FROM_NUMBER
        value: ''
      - key: FCM_PROJECT_ID
        value: ''
      - key: FCM_PRIVATE_KEY
        value: ''
      - key: FCM_CLIENT_EMAIL
        value: ''
      - key: WHATSAPP_PHONE_ID
        value: ''
      - key: WHATSAPP_ACCESS_TOKEN
        value: ''
      - key: TERMII_API_KEY
        value: ''
      - key: TERMII_SENDER_ID
        value: ''
      - key: PAYSTACK_SECRET_KEY
        value: ''
      - key: FLUTTERWAVE_SECRET_HASH
        value: ''
      - key: OPAY_SECRET_KEY
        value: ''
      - key: INTERSWITCH_SECRET_KEY
        value: ''
