  description: Event-driven notification system for financial services — 25 event
    types, 5 delivery channels, TRAI/NCC DND compliance, consent management,
    digests. Requests and responses are snake_case; errors use { error, message,
    details, request_id }.
  version: 1.0.0
  contact: {}
tags: []
servers:
  - url: http://localhost:3000
    description: Local development
components:
  securitySchemes:
    JWT:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RecordConsentBody:
      type: object
      properties:
        channel:
          type: string
          enum:
            - sms
            - email
            - push
            - whatsapp
            - in_app
          example: whatsapp
        consentType:
          type: string
          enum:
            - OPT_IN
            - OPT_OUT
            - WHATSAPP_OPT_IN
            - WHATSAPP_OPT_OUT
          description: WhatsApp needs its own opt-in (WHATSAPP_OPT_IN / WHATSAPP_OPT_OUT)
            under the WhatsApp Business Policy; every other channel uses OPT_IN
            / OPT_OUT.
        consentText:
          type: string
          description: The exact wording shown to the user when they consented. Stored
            verbatim as evidence.
          example: I agree to receive investment updates from WealthBridge on WhatsApp.
        ipAddress:
          type: string
          description: The END USER's IP address (callers are usually a backend service,
            so it cannot be inferred). Falls back to the request IP.
          example: 197.210.10.4
        userAgent:
          type: string
          description: The end user's browser / app user agent
      required:
        - channel
        - consentType
        - consentText
    ChannelPreferencesDto:
      type: object
      properties:
        sms:
          type: boolean
        email:
          type: boolean
        push:
          type: boolean
        whatsapp:
          type: boolean
        in_app:
          type: boolean
    UpdatePreferenceDto:
      type: object
      properties:
        category:
          type: string
          example: TXNX
          description: Event category code e.g. TXNX, RISK, SIPX, MKTX, REGX
        eventType:
          type: string
        channels:
          $ref: "#/components/schemas/ChannelPreferencesDto"
        digestMode:
          type: string
          enum:
            - IMMEDIATE
            - HOURLY
            - DAILY
        quietHoursStart:
          type: string
          example: 22:00
        quietHoursEnd:
          type: string
          example: 07:30
      required:
        - category
        - channels
    ResolveDlqDto:
      type: object
      properties:
        action:
          type: string
          enum:
            - retry
            - discard
        resolvedBy:
          type: string
          description: Operator identifier; defaults to "operator".
      required:
        - action
    PreviewNotificationDto:
      type: object
      properties:
        userId:
          type: string
          example: a3f1c2e0-...
        eventType:
          type: string
          example: RISK-001
        payload:
          type: object
          example:
            symbol: RELIANCE
            amount: 50000
            marginShortfall: 12500
          description: Same payload shape as the real event ingestion endpoint
        localeOverride:
          type: string
          example: hi
          description: Override the user's stored language preference for this preview only
      required:
        - userId
        - eventType
        - payload
    IngestEventDto:
      type: object
      properties:
        eventType:
          type: string
          example: RISK-001
        eventId:
          type: string
          example: EVT-2025-03-19-MC-847291
        sourceSystem:
          type: string
          example: margin_engine
        timestamp:
          type: string
          example: 2025-03-19T10:15:23.456Z
        priority:
          type: number
          example: 1
          minimum: 1
          maximum: 5
        userId:
          type: string
          example: usr_a1b2c3d4-e5f6-7890-abcd-ef1234567890
        payload:
          type: object
          example:
            shortfall_amount: 125000
            deadline: 2025-03-19T11:30:00Z
        idempotencyKey:
          type: string
          example: margin-call-usr_a1b2c3d4-2025-03-19T10:15
      required:
        - eventType
        - eventId
        - sourceSystem
        - timestamp
        - priority
        - userId
        - payload
    LoginDto:
      type: object
      properties: {}
    RefreshDto:
      type: object
      properties: {}
    RequestOtpDto:
      type: object
      properties: {}
    VerifyOtpDto:
      type: object
      properties: {}
    RequestSignupDto:
      type: object
      properties: {}
    VerifySignupDto:
      type: object
      properties: {}
